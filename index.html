<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeyME — AI Voice & Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A10;
            --bg-card: #14141E;
            --bg-card-hover: #1C1C28;
            --bg-surface: #18182244;
            --bg-input: #1E1E2A;
            --primary: #8B5CF6;
            --primary-light: #A78BFA;
            --primary-dark: #6D28D9;
            --accent: #F472B6;
            --accent2: #38BDF8;
            --text: #F1F1F6;
            --text-muted: #8888A0;
            --text-dim: #55556A;
            --border: #262636;
            --success: #34D399;
            --warning: #FBBF24;
            --danger: #F87171;
            --gradient-1: linear-gradient(135deg, #8B5CF6 0%, #F472B6 100%);
            --gradient-2: linear-gradient(135deg, #38BDF8 0%, #8B5CF6 100%);
            --gradient-3: linear-gradient(135deg, #F472B6 0%, #FB923C 100%);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 40px rgba(139,92,246,0.15);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; overflow:hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 0; }

        /* ── SCREEN SYSTEM ── */
        .screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translateX(30px);
            z-index: 1;
        }
        .screen.active {
            opacity: 1; pointer-events: all;
            transform: translateX(0);
            z-index: 10;
         overflow-y:auto !important; -webkit-overflow-scrolling:touch;}
        .screen.slide-out {
            opacity: 0; transform: translateX(-30px);
        }

        /* ── TOP NAV ── */
        .top-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px 10px;
            position: relative; z-index: 20;
            background: linear-gradient(to bottom, var(--bg) 60%, transparent);
        }
        .top-nav .logo { height: 28px; }
        .top-nav .credits-badge {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .top-nav .credits-badge:hover { border-color: var(--primary); }
        .top-nav .credits-badge .coin {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--gradient-1);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800;
        }

        /* ── HOME SCREEN ── */
        .home-content {
            flex: 1; overflow-y: auto; padding-bottom: 80px;
            scroll-behavior: smooth;
        }

        /* Banner Carousel */
        .carousel-wrapper {
            position: relative;
            margin: 8px 16px 20px;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 16/8;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            height: 100%;
        }
        .carousel-slide {
            min-width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 28px;
            position: relative; overflow: hidden;
        }
        .carousel-slide::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(244,114,182,0.15));
            z-index: 0;
        }
        .carousel-slide.slide-char::before {
            background: linear-gradient(135deg, rgba(0,0,0,0.5), rgba(0,0,0,0.3));
        }
        .carousel-slide .slide-content {
            position: relative; z-index: 2;
            text-align: center; width: 100%;
        }
        .carousel-slide .slide-emoji { font-size: 36px; margin-bottom: 6px; }
        .carousel-slide .slide-tag {
            font-size: 11px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; color: var(--accent);
            margin-bottom: 4px;
        }
        .carousel-slide .slide-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .carousel-slide .slide-desc {
            font-size: 12px; color: var(--text-muted);
            line-height: 1.5; margin-bottom: 12px;
        }
        .carousel-slide .slide-btn {
            display: inline-block;
            padding: 8px 24px; border-radius: 20px;
            background: var(--gradient-1);
            font-size: 13px; font-weight: 700;
            color: #fff; border: none; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .carousel-slide .slide-btn:active { transform: scale(0.95); }
        .slide-intro-title {
            font-size: 22px; font-weight: 800; line-height: 1.4;
            margin-bottom: 8px;
            background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .slide-intro-sub { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

        /* Carousel dots */
        .carousel-dots {
            display: flex; justify-content: center; gap: 6px;
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 5;
        }
        .carousel-dots .dot {
            width: 6px; height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s;
        }
        .carousel-dots .dot.active {
            width: 20px; background: var(--primary);
        }

        /* Section */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; margin-bottom: 14px;
        }
        .section-header h2 {
            font-size: 17px; font-weight: 800;
        }
        .section-header span {
            font-size: 12px; color: var(--text-dim);
        }

        /* Character Grid */
        .char-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; padding: 0 16px; margin-bottom: 24px;
        }
        .char-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden; cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
        }
        .char-card:active { transform: scale(0.97); }
        .char-card:hover { border-color: var(--primary); box-shadow: var(--shadow-glow); }
        .char-card .card-video-wrap {
            position: relative; width: 100%; aspect-ratio: 3/4;
            overflow: hidden;
        }
        .char-card video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .char-card .card-video-wrap::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(10,10,16,0.95) 0%, transparent 60%);
        }
        .char-card .card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 14px; z-index: 2;
        }
        .char-card .card-tag {
            font-size: 10px; font-weight: 600;
            padding: 3px 8px; border-radius: 10px;
            background: rgba(139,92,246,0.25); color: var(--primary-light);
            display: inline-block; margin-bottom: 6px;
        }
        .char-card .card-name {
            font-size: 15px; font-weight: 800; margin-bottom: 3px;
        }
        .char-card .card-desc {
            font-size: 11px; color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .char-card .card-meta {
            display: flex; gap: 10px; margin-top: 8px;
            font-size: 10px; color: var(--text-dim);
        }
        .char-card .card-meta span { display: flex; align-items: center; gap: 3px; }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            display: flex; align-items: center; justify-content: space-around;
            padding: 10px 0 max(10px, env(safe-area-inset-bottom));
            background: rgba(10,10,16,0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .bottom-nav .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 3px; cursor: pointer; padding: 4px 16px;
            color: var(--text-dim); transition: color 0.2s;
            font-size: 10px; font-weight: 600;
            position: relative;
        }
        .bottom-nav .nav-item.active { color: var(--primary); }
        .bottom-nav .nav-item svg { width: 22px; height: 22px; }
        .bottom-nav .nav-item.active::before {
            content: ''; position: absolute; top: -10px;
            width: 20px; height: 3px; border-radius: 2px;
            background: var(--primary);
        }

        /* ── CHARACTER PROFILE SCREEN ── */
        .profile-screen { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
        .profile-screen .profile-hero {
            position: relative; width: 100%; aspect-ratio: 9/7; max-height: 250px;
            overflow: hidden;
        }
        .profile-screen .profile-hero video { max-height: 300px !important;
            width: 100%; height: 100%; object-fit: cover;
        }
        .profile-screen .profile-hero::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg) 0%, transparent 50%);
        }
        .profile-screen .profile-back {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; color: #fff;
            transition: transform 0.2s;
        }
        .profile-screen .profile-back:active { transform: scale(0.9); }
        .profile-screen .profile-body {
            flex: 1; overflow-y: auto;
            margin-top: -60px; position: relative; z-index: 2;
            padding: 0 20px 100px;
        }
        .profile-screen .profile-tag {
            font-size: 12px; font-weight: 600;
            color: var(--accent); margin-bottom: 4px;
        }
        .profile-screen .profile-name {
            font-size: 26px; font-weight: 900; margin-bottom: 4px;
        }
        .profile-screen .profile-mbti {
            display: inline-block;
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 8px;
            background: rgba(139,92,246,0.2); color: var(--primary-light);
            margin-bottom: 12px;
        }
        .profile-screen .profile-personality {
            font-size: 13px; color: var(--text-muted); line-height: 1.7;
            margin-bottom: 20px;
        }
        .profile-gallery-title {
            font-size: 14px; font-weight: 700; margin-bottom: 10px;
        }
        .profile-gallery {
            display: flex; gap: 10px; overflow-x: auto;
            padding-bottom: 12px; margin-bottom: 24px;
            scroll-snap-type: x mandatory;
        }
        .profile-gallery::-webkit-scrollbar { display: none; }
        .profile-gallery .gallery-item { flex-shrink: 0;
            min-width: 140px; aspect-ratio: 9/16;
            border-radius: var(--radius-sm); overflow: hidden;
            scroll-snap-align: start; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .profile-gallery .gallery-item video { width: 140px; height: 180px;
            width: 100%; height: 100%; object-fit: cover;
        }
        .profile-actions {
            display: flex; gap: 12px; margin-top: 8px;
        }
        .profile-actions button {
            flex: 1; padding: 16px; border-radius: var(--radius);
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; border: none; transition: all 0.2s;
        }
        .profile-actions button:active { transform: scale(0.96); }
        .profile-actions .btn-chat {
            background: var(--gradient-1); color: #fff;
        }
        .profile-actions .btn-call {
            background: var(--bg-card); color: var(--text);
            border: 1px solid var(--border);
        }

        /* ── CHAT SCREEN ── */
        .chat-screen { background: var(--bg); }
        .chat-bg {
            position: absolute; inset: 0; z-index: 0;
            background-size: cover; background-position: center;
        }
        .chat-bg::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(10,10,16,0.82);
        }
        .chat-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: rgba(10,10,16,0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative; z-index: 5;
        }
        .chat-header .ch-back {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: none; border: none; color: var(--text);
            transition: background 0.2s;
        }
        .chat-header .ch-back:hover { background: rgba(255,255,255,0.1); }
        .chat-header .ch-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--primary);
        }
        .chat-header .ch-info { flex: 1; }
        .chat-header .ch-name { font-size: 14px; font-weight: 700; }
        .chat-header .ch-status {
            font-size: 11px; color: var(--success);
            display: flex; align-items: center; gap: 4px;
        }
        .chat-header .ch-status::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chat-header .ch-right {
            display: flex; align-items: center; gap: 8px;
        }
        .chat-header .ch-phone {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(52,211,153,0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; color: var(--success);
            transition: all 0.2s;
        }
        .chat-header .ch-phone:active { transform: scale(0.9); }
        .intimacy-bar-wrap {
            display: flex; align-items: center; gap: 6px;
            padding: 0 16px 8px;
            background: rgba(10,10,16,0.6);
            position: relative; z-index: 5;
        }
        .intimacy-label {
            font-size: 10px; font-weight: 700; color: var(--primary-light);
            white-space: nowrap;
        }
        .intimacy-bar {
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .intimacy-fill {
            height: 100%; border-radius: 2px;
            background: var(--gradient-1);
            transition: width 0.5s ease;
        }
        .free-dots {
            display: flex; align-items: center; justify-content: center;
            gap: 4px; padding: 6px 0;
            position: relative; z-index: 5;
        }
        .free-dots .dot-label { font-size: 10px; color: var(--text-dim); margin-right: 4px; }
        .free-dots .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.12);
            transition: background 0.3s;
        }
        .free-dots .dot.used { background: var(--primary); }

        /* Messages */
        .chat-messages {
            flex: 1; overflow-y: auto;
            padding: 12px 16px 12px;
            position: relative; z-index: 3;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg {
            display: flex; gap: 8px;
            max-width: 82%;
            animation: msgIn 0.35s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.ai { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg .msg-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            object-fit: cover; object-position: center 20%; flex-shrink: 0;
            margin-top: 2px;
        }
        .msg .msg-bubble {
            padding: 10px 14px;
            font-size: 13.5px; line-height: 1.6;
            border-radius: 18px;
            position: relative;
        }
        .msg.ai .msg-bubble {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 4px 18px 18px 18px;
            color: var(--text);
        }
        .msg.user .msg-bubble {
            background: var(--primary);
            border-radius: 18px 4px 18px 18px;
            color: #fff;
        }
        .msg .msg-time {
            font-size: 9px; color: var(--text-dim);
            margin-top: 4px;
            text-align: right;
        }
        .msg.ai .msg-time { text-align: left; }

        /* Typing indicator */
        .typing-indicator {
            display: none; align-self: flex-start;
            padding: 10px 16px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 4px 18px 18px 18px;
            margin-left: 38px;
            gap: 5px;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Chat input */
        .chat-input-wrap {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px max(10px, env(safe-area-inset-bottom));
            background: rgba(10,10,16,0.8);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.05);
            position: relative; z-index: 5;
        }
        .chat-input-wrap input {
            flex: 1; padding: 12px 16px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 24px; color: var(--text);
            font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s;
        }
        .chat-input-wrap input:focus { border-color: var(--primary); }
        .chat-input-wrap input::placeholder { color: var(--text-dim); }
        .chat-input-wrap .send-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--gradient-1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; color: #fff;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .chat-input-wrap .send-btn:active { transform: scale(0.9); }

        /* ── VOICE CALL SCREEN ── */
        .call-screen {
            background: radial-gradient(ellipse at center, #1a1028 0%, #0A0A10 70%);
            align-items: center; justify-content: center;
        }
        .call-back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; color: var(--text);
        }
        .call-video-wrap {
            position: relative;
            width: 200px; height: 200px;
            border-radius: 50%; overflow: hidden;
            margin-bottom: 24px;
        }
        .call-video-wrap::before {
            content: ''; position: absolute; inset: -6px;
            border-radius: 50%;
            background: var(--gradient-1);
            animation: callPulse 2s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes callPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .call-video-wrap video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .call-video-glow {
            position: absolute; inset: -40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.25) 0%, transparent 70%);
            animation: callGlow 3s ease-in-out infinite;
            z-index: -2;
        }
        @keyframes callGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .call-name {
            font-size: 22px; font-weight: 800; margin-bottom: 4px;
            text-align: center;
        }
        .call-timer {
            font-size: 14px; color: var(--text-muted);
            font-weight: 500; margin-bottom: 32px;
            font-variant-numeric: tabular-nums;
        }

        /* Sound wave */
        .sound-wave {
            display: flex; align-items: center; justify-content: center;
            gap: 3px; height: 40px; margin-bottom: 40px;
        }
        .sound-wave .bar {
            width: 3px; border-radius: 2px;
            background: var(--primary);
            animation: wave 1s ease-in-out infinite;
        }
        .sound-wave .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .sound-wave .bar:nth-child(2) { height: 22px; animation-delay: 0.1s; }
        .sound-wave .bar:nth-child(3) { height: 32px; animation-delay: 0.2s; }
        .sound-wave .bar:nth-child(4) { height: 18px; animation-delay: 0.3s; }
        .sound-wave .bar:nth-child(5) { height: 28px; animation-delay: 0.15s; }
        .sound-wave .bar:nth-child(6) { height: 14px; animation-delay: 0.25s; }
        .sound-wave .bar:nth-child(7) { height: 24px; animation-delay: 0.05s; }
        .sound-wave .bar:nth-child(8) { height: 16px; animation-delay: 0.35s; }
        .sound-wave .bar:nth-child(9) { height: 30px; animation-delay: 0.12s; }
        .sound-wave .bar:nth-child(10) { height: 20px; animation-delay: 0.22s; }
        .sound-wave .bar:nth-child(11) { height: 10px; animation-delay: 0.08s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        .call-controls {
            display: flex; align-items: center; gap: 32px;
        }
        .call-controls button {
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .call-controls button:active { transform: scale(0.9); }
        .call-mic-btn {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }
        .call-mic-btn.muted { background: rgba(255,255,255,0.05); color: var(--text-dim); }
        .call-end-btn {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--danger);
            color: #fff;
        }
        .call-msg-bubble {
            position: absolute; bottom: 180px; left: 20px; right: 20px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            font-size: 14px; line-height: 1.6;
            color: var(--text);
            text-align: center;
            opacity: 0; transform: translateY(10px);
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .call-msg-bubble.show {
            opacity: 1; transform: translateY(0);
        }

        /* ── CREDIT SHOP SCREEN ── */
        .shop-screen .shop-scroll {
            flex: 1; overflow-y: auto;
            padding: 0 16px 100px;
        }
        .shop-header {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px;
        }
        .shop-header .sh-back {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: none; border: none; color: var(--text);
        }
        .shop-header h2 { font-size: 17px; font-weight: 800; }
        .shop-balance {
            text-align: center; padding: 24px 0 28px;
        }
        .shop-balance .bal-label {
            font-size: 12px; color: var(--text-muted); margin-bottom: 6px;
        }
        .shop-balance .bal-amount {
            font-size: 36px; font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .shop-balance .bal-unit {
            font-size: 14px; color: var(--text-muted); font-weight: 500;
        }
        .shop-packages {
            display: flex; flex-direction: column; gap: 12px;
        }
        .shop-pkg {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .shop-pkg:active { transform: scale(0.98); }
        .shop-pkg:hover { border-color: var(--primary); }
        .shop-pkg.best {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(244,114,182,0.08), rgba(139,92,246,0.08));
        }
        .shop-pkg.best::before {
            content: 'BEST'; position: absolute; top: 10px; right: 10px;
            font-size: 9px; font-weight: 800;
            padding: 2px 8px; border-radius: 6px;
            background: var(--accent); color: #fff;
        }
        .pkg-left .pkg-credits {
            font-size: 18px; font-weight: 800; margin-bottom: 2px;
        }
        .pkg-left .pkg-bonus {
            font-size: 11px; color: var(--accent); font-weight: 600;
        }
        .pkg-right .pkg-price {
            font-size: 15px; font-weight: 700; color: var(--text);
        }

        /* ── MY SCREEN ── */
        .my-screen .my-scroll {
            flex: 1; overflow-y: auto; padding: 0 16px 100px;
        }
        .my-header {
            padding: 20px 16px; text-align: center;
        }
        .my-header h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .my-header p { font-size: 13px; color: var(--text-muted); }
        .my-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 24px;
        }
        .my-stat {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 10px; text-align: center;
        }
        .my-stat .stat-val {
            font-size: 20px; font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .my-stat .stat-label {
            font-size: 10px; color: var(--text-dim); margin-top: 4px;
        }
        .my-section-title {
            font-size: 14px; font-weight: 700; margin-bottom: 10px;
            padding-left: 4px;
        }
        .my-history-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; background: var(--bg-card);
            border-radius: var(--radius-sm); margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .my-history-item img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
        }
        .my-history-item .mh-info { flex: 1; }
        .my-history-item .mh-name { font-size: 13px; font-weight: 700; }
        .my-history-item .mh-preview { font-size: 11px; color: var(--text-muted); }
        .my-history-item .mh-time { font-size: 10px; color: var(--text-dim); }

        /* ── CREDIT MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            max-width: 340px; width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-icon {
            font-size: 48px; margin-bottom: 12px;
        }
        .modal-title {
            font-size: 18px; font-weight: 800; margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 13px; color: var(--text-muted); line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-actions { display: flex; flex-direction: column; gap: 8px; }
        .modal-actions button {
            padding: 14px; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700;
            cursor: pointer; border: none;
            transition: transform 0.2s;
        }
        .modal-actions button:active { transform: scale(0.97); }
        .modal-btn-primary { background: var(--gradient-1); color: #fff; }
        .modal-btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-muted); }

        /* Utils */
        .hidden { display: none !important; }
    </style>
</head>
<body>


<!-- ═══════════ LOGIN/REGISTER SCREEN ═══════════ -->
<div class="screen" id="screen-auth" style="overflow-y:auto;">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 24px;">
        <!-- Logo -->
        <div style="margin-bottom:30px;text-align:center;">
            <div style="font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#8B5CF6,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;">HeyME</div>
            <div style="font-size:0.8rem;color:#8888A0;">AI Voice & Chat Platform</div>
        </div>

        <!-- Auth Card -->
        <div style="width:100%;background:#14141E;border-radius:20px;padding:28px 24px;border:1px solid #262636;">
            <!-- Tabs -->
            <div style="display:flex;margin-bottom:24px;background:#1E1E2A;border-radius:12px;padding:3px;">
                <button id="tabLogin" onclick="switchAuthTab('login')" style="flex:1;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#8B5CF6,#F472B6);color:#fff;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.3s;">로그인</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" style="flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:#8888A0;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.3s;">회원가입</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div style="margin-bottom:14px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">이메일</label>
                    <input id="loginEmail" type="email" placeholder="이메일을 입력하세요" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">비밀번호</label>
                    <input id="loginPw" type="password" placeholder="비밀번호를 입력하세요" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <button onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#8B5CF6,#F472B6);color:#fff;font-size:0.95rem;font-weight:700;cursor:pointer;">로그인</button>
                <div style="text-align:center;margin-top:14px;">
                    <span style="font-size:0.75rem;color:#55556A;">비밀번호를 잊으셨나요?</span>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display:none;">
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">닉네임</label>
                    <input id="regNick" type="text" placeholder="닉네임을 입력하세요" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">이메일</label>
                    <input id="regEmail" type="email" placeholder="이메일을 입력하세요" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">비밀번호</label>
                    <input id="regPw" type="password" placeholder="비밀번호 (8자 이상)" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">생년월일</label>
                    <input id="regBirth" type="date" style="width:100%;padding:12px 14px;background:#1E1E2A;border:1px solid #262636;border-radius:12px;color:#F1F1F6;font-size:0.9rem;outline:none;font-family:Inter,sans-serif;" onfocus="this.style.borderColor='#8B5CF6'" onblur="this.style.borderColor='#262636'">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.75rem;color:#8888A0;margin-bottom:6px;display:block;">성별</label>
                    <div style="display:flex;gap:8px;">
                        <button id="genderM" onclick="selectGender('male')" style="flex:1;padding:10px;border:1px solid #262636;border-radius:10px;background:#1E1E2A;color:#8888A0;font-size:0.85rem;cursor:pointer;">남성</button>
                        <button id="genderF" onclick="selectGender('female')" style="flex:1;padding:10px;border:1px solid #262636;border-radius:10px;background:#1E1E2A;color:#8888A0;font-size:0.85rem;cursor:pointer;">여성</button>
                        <button id="genderO" onclick="selectGender('other')" style="flex:1;padding:10px;border:1px solid #262636;border-radius:10px;background:#1E1E2A;color:#8888A0;font-size:0.85rem;cursor:pointer;">기타</button>
                    </div>
                </div>
                <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:18px;">
                    <input id="regAgree" type="checkbox" style="margin-top:3px;accent-color:#8B5CF6;">
                    <label style="font-size:0.7rem;color:#8888A0;line-height:1.5;">이용약관 및 개인정보 처리방침에 동의합니다. 마케팅 정보 수신에 동의합니다.</label>
                </div>
                <button onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#8B5CF6,#F472B6);color:#fff;font-size:0.95rem;font-weight:700;cursor:pointer;">가입하기</button>
            </div>
        </div>

        <!-- Social Login -->
        <div style="margin-top:24px;text-align:center;width:100%;">
            <div style="font-size:0.75rem;color:#55556A;margin-bottom:14px;">간편 로그인</div>
            <div style="display:flex;gap:12px;justify-content:center;">
                <button onclick="socialLogin('kakao')" style="width:48px;height:48px;border-radius:12px;border:none;background:#FEE500;cursor:pointer;font-size:1.2rem;">K</button>
                <button onclick="socialLogin('google')" style="width:48px;height:48px;border-radius:12px;border:1px solid #262636;background:#14141E;cursor:pointer;font-size:1.2rem;">G</button>
                <button onclick="socialLogin('apple')" style="width:48px;height:48px;border-radius:12px;border:1px solid #262636;background:#14141E;color:#fff;cursor:pointer;font-size:1.2rem;">A</button>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════ HOME SCREEN ═══════════ -->
<div class="screen active" id="screen-home">
    <div class="top-nav">
        <span style="font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,#8B5CF6,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px;">HeyME</span>
        <button onclick="checkAuthAndAct('login')" id="loginBtn" style="background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:50px;font-size:0.75rem;cursor:pointer;margin-right:6px;">로그인</button>
        <div class="credits-badge" onclick="showScreen('screen-shop')">
            <span class="coin">C</span>
            <span id="home-credits">50</span>
        </div>
    </div>
    <div class="home-content">
        <!-- Banner Carousel -->
        <div class="carousel-wrapper" id="carousel">
            <div class="carousel-track" id="carousel-track"></div>
            <div class="carousel-dots" id="carousel-dots"></div>

        <!-- Character Grid -->
        <div class="section-header">
            <h2>캐릭터</h2>

        </div>
        <div class="char-grid" id="char-grid"></div>

</div>

<!-- ═══════════ CHARACTER PROFILE SCREEN ═══════════ -->
<div class="screen profile-screen" id="screen-profile" style="overflow:hidden;">
    <!-- Top bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,10,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:relative;z-index:10;">
        <button onclick="showScreen('screen-home')" style="width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-card);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#8592;</button>
        <div style="text-align:center;">
            <div id="profile-name2" style="font-size:1rem;font-weight:800;"></div>
            <div id="profile-tag2" style="font-size:0.7rem;color:var(--primary-light);font-weight:600;"></div>
        </div>
        <div style="width:36px;"></div>
    </div>

    <!-- Image carousel (fills remaining space) -->
    <div style="flex:1;position:relative;overflow:hidden;" id="profileCarouselWrap">
        <div id="profileCarousel" style="display:flex;height:100%;transition:transform 0.4s ease;">
            <div class="prof-slide" style="min-width:100%;height:100%;position:relative;">
                <video id="profV1" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;"></video>
            </div>
            <div class="prof-slide" style="min-width:100%;height:100%;position:relative;">
                <video id="profV2" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;"></video>
            </div>
            <div class="prof-slide" style="min-width:100%;height:100%;position:relative;">
                <video id="profV3" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;"></video>

        </div>
        <!-- Character info overlay -->
        <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(to top,rgba(10,10,16,0.95),transparent);z-index:4;">
            <div style="display:flex;gap:6px;margin-bottom:6px;">
                <span id="profile-mbti2" style="background:rgba(139,92,246,0.2);color:var(--primary-light);padding:2px 8px;border-radius:50px;font-size:0.65rem;font-weight:700;"></span>
            </div>
            <div id="profile-desc2" style="font-size:0.8rem;color:var(--text-muted);line-height:1.5;"></div>
        </div>
    </div>

    <!-- Bottom buttons (fixed) -->
    <div style="display:flex;gap:10px;padding:14px 16px 24px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;">
        <button id="profile-chat-btn2" style="flex:1;padding:14px;border:none;border-radius:14px;background:var(--gradient-1);color:#fff;font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">&#x1F4AC; 채팅하기</button>
        <button id="profile-call-btn2" style="flex:1;padding:14px;border:none;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">&#x1F4DE; 전화하기</button>
    </div>
</div>

<!-- ═══════════ CHAT SCREEN ═══════════ -->
<div class="screen chat-screen" id="screen-chat">
    <div class="chat-bg" id="chat-bg"></div>
    <div class="chat-header">
        <button class="ch-back" onclick="showScreen('screen-home')">

        </button>
    </div>
</div>

<!-- ═══════════ VOICE CALL SCREEN ═══════════ -->
<div class="screen call-screen" id="screen-call">
    <button class="call-back-btn" onclick="endCall()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 4l-8 8 8 8"/></svg>
    </button>
    <div class="call-video-glow"></div>
    <div class="call-video-wrap">
        <video id="call-video" autoplay muted loop playsinline></video>

function showScreen(id, skipAnim) {
    const prev = document.querySelector('.screen.active');
    const next = document.getElementById(id);
    if (!next || next === prev) return;

    if (prev) {
        prev.classList.remove('active');
        prev.classList.add('slide-out');
        setTimeout(() => prev.classList.remove('slide-out'), 400);
    }
    next.classList.add('active');
    currentScreen = id;

    // Show/hide bottom nav
    const hideNav = ['screen-auth', 'screen-chat', 'screen-call', 'screen-profile'];
    document.getElementById('bottom-nav').style.display = hideNav.includes(id) ? 'none' : 'flex';

    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.screen === id);
    });

    // Refresh data
    if (id === 'screen-home') refreshHome();
    if (id === 'screen-shop') refreshShop();
    if (id === 'screen-my') refreshMy();
}

function navTo(id) { showScreen(id); }

// ═══════════ CAROUSEL ═══════════
let carouselIndex = 0;
let carouselAutoTimer = null;
let touchStartX = 0;

function buildCarousel() {
    const track = document.getElementById('carousel-track');
    const dots = document.getElementById('carousel-dots');

    // Slide 0: Intro
    let html = `<div class="carousel-slide">
        <div class="slide-content">
            <div class="slide-intro-title">Talk with your<br>favorite characters</div>
            <div class="slide-intro-sub">AI 캐릭터와 자유로운 대화를 나눠보세요.<br>음성 통화도 지원합니다.</div>
        </div>
    </div>`;

    characters.forEach(c => {
        html += `<div class="carousel-slide slide-char" style="background:linear-gradient(135deg,${c.color}22,${c.color}11)">
            <div class="slide-content">
                <div class="slide-emoji">${c.emoji}</div>
                <div class="slide-tag">${c.tag}</div>
                <div class="slide-name">${c.name}</div>
                <div class="slide-desc">${c.desc}</div>
                <button class="slide-btn" onclick="openProfile('${c.id}')">대화 시작</button>
            </div>
        </div>`;
    });

    track.innerHTML = html;

    let dotsHtml = '';
    for (let i = 0; i < 5; i++) {
        dotsHtml += `<div class="dot ${i === 0 ? 'active' : ''}"></div>`;
    }
    dots.innerHTML = dotsHtml;

    goToSlide(0);
    startCarouselAuto();

    // Swipe
    const wrapper = document.getElementById('carousel');
    wrapper.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
    wrapper.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
            if (diff > 0) goToSlide(carouselIndex + 1);
            else goToSlide(carouselIndex - 1);
            startCarouselAuto();
        }
    }, {passive:true});
}

function goToSlide(i) {
    const total = 5;
    if (i < 0) i = total - 1;
    if (i >= total) i = 0;
    carouselIndex = i;
    document.getElementById('carousel-track').style.transform = `translateX(-${i * 100}%)`;
    document.querySelectorAll('#carousel-dots .dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === i);
    });
}

function startCarouselAuto() {
    clearInterval(carouselAutoTimer);
    carouselAutoTimer = setInterval(() => goToSlide(carouselIndex + 1), 4000);
}

// ═══════════ CHARACTER GRID ═══════════
function buildCharGrid() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = characters.map(c => {

            <div class="card-video-wrap">

    document.getElementById('profile-mbti2').textContent = currentChar.mbti;
    document.getElementById('profile-desc2').textContent = currentChar.desc;
    
    document.getElementById('profile-chat-btn2').onclick = function() { openChat(charId); };
    document.getElementById('profile-call-btn2').onclick = function() { openCall(charId); };
    
    profileSlideIdx = 0;
    goProfileSlide(0);
    showScreen('screen-profile');
}

var profileSlideIdx = 0;
function goProfileSlide(idx) {
    profileSlideIdx = idx;
    document.getElementById('profileCarousel').style.transform = 'translateX(-' + (idx * 100) + '%)';
    document.querySelectorAll('.prof-dot').forEach(function(d, i) {
        d.style.opacity = i === idx ? '1' : '0.4';
        d.style.width = i === idx ? '20px' : '8px';
        d.style.borderRadius = i === idx ? '4px' : '50%';
    });
}

// Profile swipe
(function() {
    var sx = 0;
    document.addEventListener('DOMContentLoaded', function() {
        var wrap = document.getElementById('profileCarouselWrap');
        if (wrap) {
            wrap.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; });
            wrap.addEventListener('touchend', function(e) {
                var diff = sx - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) goProfileSlide(Math.min(profileSlideIdx + 1, 2));
                    else goProfileSlide(Math.max(profileSlideIdx - 1, 0));
                }
            });
        }
    });
})();

function openChat(charId) {
    currentChar = characters.find(c => c.id === charId);
    if (!currentChar) return;

    document.getElementById('chat-bg').style.backgroundImage = `url(bg_chat_${charId}.jpg)`;
    document.getElementById('chat-avatar').src = `${charId}_face.jpg`;
    document.getElementById('chat-name').textContent = currentChar.name;
    document.getElementById('chat-call-btn').onclick = () => openCall(charId);

    // Init state
    if (!state.intimacy[charId]) state.intimacy[charId] = { msgs: 0, level: 1 };
    if (!state.chatHistory[charId]) state.chatHistory[charId] = [];
    if (!state.freeChats[charId]) state.freeChats[charId] = { date: getTodayStr(), used: 0 };

    // Reset daily
    if (state.freeChats[charId].date !== getTodayStr()) {
        state.freeChats[charId] = { date: getTodayStr(), used: 0 };
    }
    saveState();

    renderChat();
    showScreen('screen-chat');

    // Greeting if no history
    if (state.chatHistory[charId].length === 0) {
        setTimeout(() => {
            addAIMessage(currentChar.greeting);
        }, 600);
    }
}

function renderChat() {
    if (!currentChar) return;
    const charId = currentChar.id;

    // Intimacy
    const int = state.intimacy[charId];
    document.getElementById('intimacy-label').textContent = `Lv.${int.level}`;
    const progress = ((int.msgs % 3) / 3) * 100;
    document.getElementById('intimacy-fill').style.width = `${Math.min(100, (int.level - 1) * 10 + progress / 10 * 10)}%`;

    // Free dots
    const freeUsed = state.freeChats[charId].used;
    const dotsWrap = document.getElementById('free-dots');
    dotsWrap.innerHTML = `<span class="dot-label">무료 ${Math.max(0, 5 - freeUsed)}/5</span>` +
        Array.from({length:5}, (_, i) => `<div class="dot ${i < freeUsed ? 'used' : ''}"></div>`).join('');

    // Messages
    const msgWrap = document.getElementById('chat-messages');
    const typingEl = document.getElementById('typing-indicator');
    msgWrap.innerHTML = '';
    (state.chatHistory[charId] || []).forEach(m => {
        msgWrap.appendChild(createMsgEl(m));
    });
    msgWrap.appendChild(typingEl);
    scrollChat();
}

function createMsgEl(m) {
    const div = document.createElement('div');
    div.className = `msg ${m.role === 'user' ? 'user' : 'ai'}`;
    if (m.role === 'ai') {
        div.innerHTML = `<img class="msg-avatar" src="${currentChar.id}_face.jpg" alt="">
            <div><div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}</div></div>`;
    } else {
        div.innerHTML = `<div><div class="msg-bubble">${m.text}</div><div class="msg-time">${m.time}</div></div>`;
    }
    return div;
}

function scrollChat() {
    const el = document.getElementById('chat-messages');
    setTimeout(() => el.scrollTop = el.scrollHeight, 50);
}

function sendMessage() {
    if (!currentChar) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    const charId = currentChar.id;

    // Check free chats / credits
    const freeUsed = state.freeChats[charId].used;
    if (freeUsed >= 5) {
        if (state.credits < 10) {
            showModal();
            return;
        }
        state.credits -= 10;
    } else {
        state.freeChats[charId].used++;
    }

    // Add user msg
    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    const userMsg = { role: 'user', text: escapeHtml(text), time: timeStr };
    state.chatHistory[charId].push(userMsg);

    // Intimacy
    state.intimacy[charId].msgs++;
    state.intimacy[charId].level = Math.min(10, Math.floor(state.intimacy[charId].msgs / 3) + 1);

    saveState();
    renderChat();

    // AI response
    showTyping(true);
    const delay = 1000 + Math.random() * 1500;
    setTimeout(() => {
        showTyping(false);
        const resp = getSmartResponse(text, currentChar);
        addAIMessage(resp);
    }, delay);
}

function addAIMessage(text) {
    if (!currentChar) return;
    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    const msg = { role: 'ai', text, time: timeStr };
    state.chatHistory[currentChar.id].push(msg);
    saveState();
    renderChat();
}

function showTyping(show) {
    document.getElementById('typing-indicator').classList.toggle('show', show);
    scrollChat();
}

// Input handlers
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});

// ═══════════ VOICE CALL ═══════════
function openCall(charId) {
    currentChar = characters.find(c => c.id === charId);
    if (!currentChar) return;

    document.getElementById('call-video').src = `${charId}_v1.mp4`;
    document.getElementById('call-name').textContent = currentChar.name;
    document.getElementById('call-timer').textContent = '00:00';
    document.getElementById('call-msg-bubble').classList.remove('show');
    micMuted = false;
    document.getElementById('call-mic-btn').classList.remove('muted');

    callSeconds = 0;
    clearInterval(callTimer);
    clearTimeout(callMsgTimer);

    showScreen('screen-call');

    // Start timer
    callTimer = setInterval(() => {
        callSeconds++;
        const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        const s = (callSeconds % 60).toString().padStart(2, '0');
        document.getElementById('call-timer').textContent = `${m}:${s}`;
    }, 1000);

    // AI speaks periodically
    scheduleCallMsg();
}

function scheduleCallMsg() {
    const delay = 3000 + Math.random() * 5000;
    callMsgTimer = setTimeout(() => {
        if (currentScreen !== 'screen-call' || !currentChar) return;
        const resp = getSmartResponse(text, currentChar);
        const bubble = document.getElementById('call-msg-bubble');
        bubble.textContent = resp;
        bubble.classList.add('show');
        setTimeout(() => bubble.classList.remove('show'), 3500);
        scheduleCallMsg();
    }, delay);
}

function toggleMic() {
    micMuted = !micMuted;
    const btn = document.getElementById('call-mic-btn');
    btn.classList.toggle('muted', micMuted);
    if (micMuted) {
        btn.innerHTML = '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2c0 .76-.12 1.5-.35 2.18"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    } else {
        btn.innerHTML = '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    }
}

function endCall() {
    clearInterval(callTimer);
    clearTimeout(callMsgTimer);
    callTimer = null;
    if (currentChar) {
        showScreen('screen-chat');
        // Ensure chat is initialized
        if (!state.chatHistory[currentChar.id]) {
            openChat(currentChar.id);
        }
    } else {
        showScreen('screen-home');
    }
}

function refreshMy() {
    // Stats
    const totalMsgs = Object.values(state.chatHistory).reduce((a, h) => a + h.filter(m => m.role === 'user').length, 0);
    const maxLevel = Object.values(state.intimacy).reduce((a, i) => Math.max(a, i.level || 1), 1);

    document.getElementById('my-stats').innerHTML = `
        <div class="my-stat"><div class="stat-val">${state.credits}</div><div class="stat-label">크레딧</div></div>
        <div class="my-stat"><div class="stat-val">${totalMsgs}</div><div class="stat-label">총 대화</div></div>
        <div class="my-stat"><div class="stat-val">Lv.${maxLevel}</div><div class="stat-label">최고 친밀도</div></div>
    `;

    // History
    const history = document.getElementById('my-history');
    let items = '';
    characters.forEach(c => {
        const h = state.chatHistory[c.id];
        if (h && h.length > 0) {
            const last = h[h.length - 1];
            items += `<div class="my-history-item" onclick="openChat('${c.id}')">
                <img src="${c.id}.jpg" alt="">
                <div class="mh-info">
                    <div class="mh-name">${c.name}</div>

                <div class="mh-time">${last.time}</div>

        }

function doLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var pw = document.getElementById('loginPw').value;
    if (!email || !pw) { alert('이메일과 비밀번호를 입력해주세요.'); return; }

    firebase.auth().signInWithEmailAndPassword(email, pw)
        .then(function(userCredential) {
            // Load user profile from DB
            firebase.database().ref('heyme_users/' + userCredential.user.uid).once('value', function(snap) {
                var profile = snap.val() || {};
                localStorage.setItem('heyme_currentUser', JSON.stringify(profile));
                if (profile.credits !== undefined) {
                    state.credits = profile.credits;
                    saveState();
                    updateCreditsDisplay();
                }
                showScreen('screen-home');
            });
        })
        .catch(function(error) {
            if (error.code === 'auth/user-not-found') alert('가입되지 않은 이메일입니다.');
            else if (error.code === 'auth/wrong-password') alert('비밀번호가 일치하지 않습니다.');
            else if (error.code === 'auth/invalid-email') alert('올바른 이메일 형식이 아닙니다.');
            else alert('로그인 실패: ' + error.message);
        });
}

function doRegister() {
    var nick = document.getElementById('regNick').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var pw = document.getElementById('regPw').value;
    var birth = document.getElementById('regBirth').value;
    var agree = document.getElementById('regAgree').checked;

    if (!nick) { alert('닉네임을 입력해주세요.'); return; }
    if (!email) { alert('이메일을 입력해주세요.'); return; }
    if (!pw || pw.length < 8) { alert('비밀번호는 8자 이상이어야 합니다.'); return; }
    if (!birth) { alert('생년월일을 선택해주세요.'); return; }
    if (!selectedGender) { alert('성별을 선택해주세요.'); return; }
    if (!agree) { alert('이용약관에 동의해주세요.'); return; }

    firebase.auth().createUserWithEmailAndPassword(email, pw)
        .then(function(userCredential) {
            var uid = userCredential.user.uid;
            var profile = {
                uid: uid,
                nickname: nick,
                email: email,
                birthdate: birth,
                gender: selectedGender,
                joinDate: new Date().toISOString(),
                credits: 50
            };
            // Save to Firebase DB
            firebase.database().ref('heyme_users/' + uid).set(profile).then(function() {
                localStorage.setItem('heyme_currentUser', JSON.stringify(profile));
                alert('가입 완료! 50 크레딧이 지급되었습니다.');
                showScreen('screen-home');
            });
        })
        .catch(function(error) {
            if (error.code === 'auth/email-already-in-use') alert('이미 가입된 이메일입니다.');
            else if (error.code === 'auth/weak-password') alert('비밀번호가 너무 약합니다.');
            else if (error.code === 'auth/invalid-email') alert('올바른 이메일 형식이 아닙니다.');
            else alert('가입 실패: ' + error.message);
        });
}

                    state.credits = profile.credits;
                    saveState();

                }
            }
        });
    }
});

                '놀자놀자!! 뭐 하고 놀까?! 나 뭐든 좋아!',
                '심심해? 나도! 같이 게임 할래?!',
                '오 좋아! 오늘 재밌는 거 보여줄게! 기대해!',
            ],
        },
    };

    // Check keywords for this character
    var charMap = keywordMap[char.id] || {};
    for (var keywords in charMap) {
        var regex = new RegExp(keywords);
        if (regex.test(msg)) {
            var pool = charMap[keywords];
            return pool[Math.floor(Math.random() * pool.length)];
        }
    }

    // Default: use original responses
    return responses[Math.floor(Math.random() * responses.length)];
}


// Check if user must login for action
function checkAuthAndAct(action, callback) {
    var user = firebase.auth().currentUser;
    if (user) {
        // Already logged in
        if (action === 'login') {
            // Show profile/logout option
            if (confirm('로그아웃 하시겠습니까?')) {
                firebase.auth().signOut();
                location.reload();
            }
        } else if (callback) callback();
    } else {
        // Show auth screen
        showScreen('screen-auth');
    }
}

// Update login button text based on auth state
firebase.auth().onAuthStateChanged(function(user) {
    var btn = document.getElementById('loginBtn');
    if (btn) {
        btn.textContent = user ? (user.email ? user.email.split('@')[0] : 'MY') : '로그인';
    }
});

// ═══════════ INIT ═══════════
function init() {
    buildCarousel();
    buildCharGrid();
    buildShop();
    refreshHome();
}

init();
</script>
